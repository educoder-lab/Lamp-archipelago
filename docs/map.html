<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171b36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="lamp-world.css">
<title>Lumina Code — ワールドマップ</title>
<style>
:root {
  --bg: #0f1226; --panel: #171b36; --panel2: #1f2447; --ink: #ece9f5; --muted: #9aa0c4;
  --gold: #f5c451; --open: #7fd1ff; --fog: #3a3f62; --skip: #c59bff;
  --sky: #16305a; --ug: #2b1a3d; --land: #17382a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
  background: var(--bg); color: var(--ink);
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 400px;
}
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 12px 20px; background: var(--panel); border-bottom: 1px solid #2a2f58;
}
header h1 { font-size: 18px; margin: 0; letter-spacing: .05em; }
.stat { font-size: 13px; color: var(--muted); }
.stat.nav a { color: var(--open); margin-left: 8px; text-decoration: none; font-size: 12px; }
.stat.nav a:hover { text-decoration: underline; }
.stat b { color: var(--ink); font-size: 15px; }
.bar { width: 120px; height: 6px; background: #2a2f58; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
.bar i { display: block; height: 100%; background: var(--gold); }
main { overflow: hidden; position: relative; min-height: 0; }
aside { background: var(--panel); border-left: 1px solid #2a2f58; overflow-y: auto; padding: 18px 20px 40px; }
aside h2 { font-size: 18px; margin: 4px 0 6px; }
aside h3 { font-size: 13px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; letter-spacing: .08em; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); color: var(--muted); margin-right: 6px; }
.tag.cleared { color: #1a1300; background: var(--gold); }
.tag.current { color: #00121d; background: var(--open); }
.tag.fog { background: var(--fog); }
.quote { border-left: 3px solid var(--open); padding: 6px 10px; margin: 10px 0; color: #cfd6f3; background: #141836; font-size: 14px; }
.warn { border-left: 3px solid #e0a040; padding: 6px 10px; margin: 10px 0; background: #2a2210; color: #f0d6a0; font-size: 13px; }
.cmd { display: flex; gap: 6px; align-items: center; background: #0b0e1f; border: 1px solid #2a2f58; border-radius: 6px; padding: 8px 10px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; margin: 6px 0; }
.cmd code { flex: 1; white-space: pre-wrap; word-break: break-all; }
button { font: inherit; cursor: pointer; }
.copy { background: var(--panel2); color: var(--ink); border: 1px solid #343a6b; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
.copy.done { color: var(--gold); border-color: var(--gold); }
.panel-btn { background: var(--panel2); color: var(--ink); border: 1px solid #343a6b; border-radius: 6px; padding: 6px 12px; font-size: 13px; margin: 4px 6px 4px 0; }
.panel-btn.warn { border-color: #c59bff; color: #e8d4ff; }
.panel-input { background: #0b0e1f; color: var(--ink); border: 1px solid #343a6b; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 14px; width: min(100%, 220px); }
.save-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
ul.lessons { list-style: none; padding: 0; margin: 0; }
ul.lessons li { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 6px 4px; border-bottom: 1px solid #23284c; font-size: 14px; }
ul.lessons li.next { background: #13283a; }
.mark { text-align: center; font-weight: bold; }
.mark.cleared { color: var(--gold); }
.mark.skipped { color: var(--skip); }
.mark.next { color: var(--open); }
.mark.todo { color: #565c86; }
ul.lessons a { color: var(--muted); font-size: 12px; margin-left: 6px; }
ul.lessons a:hover { color: var(--ink); }
.titles span { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 10px; background: #2a2410; color: var(--gold); font-size: 12px; }
.back { background: none; border: none; color: var(--open); padding: 0; font-size: 13px; }
.legend { font-size: 12px; color: var(--muted); line-height: 1.9; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 48vh 1fr; }
  aside { border-left: none; border-top: 1px solid #2a2f58; }
}
</style>
</head>
<body>
<header>
  <h1>Lumina Code — ワールドマップ</h1>
  <span class="stat">旅人 <b id="h-name"></b></span>
  <span class="stat">Lv <b id="h-level">1</b><span class="xp-bar"><i id="h-xp"></i></span></span>
  <span class="stat">灯 <b id="h-lamps"></b><span class="bar"><i id="h-bar"></i></span></span>
  <span class="stat">称号 <b id="h-titles"></b></span>
  <span class="stat" id="h-sync"></span>
  <span class="stat" id="h-auth"></span>
  <span class="stat nav">
    <a href="ref.html?p=curriculum">一覧</a>
    <a href="ref.html?p=glossary">用語</a>
    <a href="ref.html?p=world">世界</a>
    <a href="ref.html?p=titles">称号</a>
  </span>
</header>
<main>
  <div class="world-wrap" id="world">
    <button type="button" class="world-back-btn" id="world-back">← 航路へ戻る</button>
    <div class="world-nav" id="world-nav" role="toolbar" aria-label="航路ナビ">
      <button type="button" class="world-nav-btn" data-nav="overview">全体図</button>
      <button type="button" class="world-nav-btn realm sky" data-nav="sky">空</button>
      <button type="button" class="world-nav-btn realm land" data-nav="land">陸</button>
      <button type="button" class="world-nav-btn realm underground" data-nav="underground">地下</button>
      <button type="button" class="world-nav-btn" data-nav="hub">灯台の港</button>
    </div>
    <div class="world-hint">左右ドラッグで空→地下→陸へスライド · 全体図で俯瞰 · 港の門でも移動</div>
  </div>
</main>
<aside id="panel"></aside>
<div class="lv-overlay" id="lv-overlay" role="dialog" aria-modal="true" aria-labelledby="lv-title">
  <div class="lv-card">
    <div class="lv-emoji">✦</div>
    <h2 id="lv-title">レベルアップ！</h2>
    <p class="lv-sub" id="lv-sub"></p>
    <button type="button" id="lv-ok">つづける</button>
  </div>
</div>
<div class="quest-overlay" id="quest-overlay" role="dialog" aria-modal="true" aria-labelledby="qm-title">
  <div class="quest-modal">
    <div class="qm-top">
      <div class="qm-kicker" id="qm-kicker">クエスト概要</div>
      <h2 id="qm-title">講座</h2>
    </div>
    <div class="qm-body">
      <div class="qm-meta" id="qm-meta"></div>
      <p class="qm-desc" id="qm-desc"></p>
      <div class="qm-quote" id="qm-quote" hidden></div>
    </div>
    <div class="qm-actions">
      <button type="button" class="ghost" id="qm-close">やめる</button>
      <a class="primary" id="qm-go" href="#">挑戦する</a>
    </div>
  </div>
</div>

<script>
const DATA = {"prologue":"雲と海の上に浮かぶランプ諸島。拠点の港から道をたどり、島・砦・台地の灯を一つずつ点けていきます。道は推奨順に開きますが、霧の中の土地にも入ることはできます。","githubRepo":"educoder-lab/Lamp-archipelago","pagesUrl":"https://educoder-lab.github.io/Lamp-archipelago/map.html","domains":[{"id":"island-foundation","title":"基礎理論の島","realm":"sky","exam":"テクノロジ・基礎理論","npc":"灯台守レン","synopsis":"最古の灯台がある島。0と1から知の灯を点ける。","enter":"「知は粒から。ここが最初の島だ」とレンが言う。","award":"基礎理論の灯守","advisory":null},{"id":"island-algorithm","title":"アルゴリズムの島","realm":"sky","exam":"テクノロジ・アルゴリズム","npc":"時計塔の技師ミラ","synopsis":"アルゴリズムとデータ構造の塔が並ぶ島。","enter":"塔の歯車が止まり、ミラが図版を指差す。","award":"時計塔の通行手形","advisory":null},{"id":"island-hardware","title":"ハードウェアの島","realm":"sky","exam":"テクノロジ・ハードウェア","npc":"工房長ガスト","synopsis":"蒸気と歯車。CPUと記憶の話。","enter":"工房の蒸気が霧となり、ガストが基板を磨く。","award":"工房の認定","advisory":null},{"id":"island-system","title":"システム構成の島","realm":"sky","exam":"テクノロジ・システム構成","npc":"系譜士セラ","synopsis":"信頼性と冗長。システム全体の話。","enter":"系譜の帳が開き、セラが冗長の針を刺す。","award":"系譜の印","advisory":null},{"id":"island-software","title":"ソフトウェアの島","realm":"sky","exam":"テクノロジ・ソフトウェア","npc":"書庫司書オウ","synopsis":"OSとソフトウェアの層。","enter":"書庫の層が重なり、オウがプロセスの印を求める。","award":"書庫の鍵","advisory":null},{"id":"island-database","title":"データベースの島","realm":"sky","exam":"テクノロジ・データベース","npc":"水晶司ライラ","synopsis":"表と関係。データの泉。","enter":"泉底の水晶が脈打ち、ライラが関係の鎖を示す。","award":"水晶の守人","advisory":null},{"id":"island-network","title":"ネットワークの島","realm":"sky","exam":"テクノロジ・ネットワーク","npc":"航路司フェン","synopsis":"プロトコルの風路。","enter":"航路図が風にはためき、フェンが灯標を点検する。","award":"航路の墨","advisory":null},{"id":"island-security","title":"セキュリティの島","realm":"sky","exam":"テクノロジ・セキュリティ","npc":"盾商会マスター・クレス","synopsis":"脅威と暗号の商会。","enter":"盾壁の奥で、クレスが脅威のリストを広げる。","award":"盾の紋章","advisory":null},{"id":"island-media","title":"マルチメディアの島","realm":"sky","exam":"テクノロジ・マルチメディア","npc":"絵師ティア","synopsis":"見え方と体験の話。","enter":"色の試料が並び、ティアが見え方の封印を語る。","award":"絵師の落款","advisory":null},{"id":"island-corporate","title":"企業活動の島","realm":"sky","exam":"ストラテジ・企業活動","npc":"港の書記ホウ","synopsis":"企業と法務の港。","enter":"港の帳場に印鑑の列。ホウが企業の帆を数える。","award":"港の公印","advisory":null},{"id":"island-business","title":"経営戦略の島","realm":"sky","exam":"ストラテジ・経営戦略","npc":"羅針盤の執事アル","synopsis":"経営と戦略の室。","enter":"羅針盤が一瞬だけ北を指し、アルが戦略の地図を開く。","award":"羅針盤の印","advisory":null},{"id":"island-system-plan","title":"システム企画の島","realm":"sky","exam":"ストラテジ・システム企画","npc":"設計士ナギ","synopsis":"システム化計画の港。","enter":"企画港に錨が下り、ナギが要件の潮を見る。","award":"企画港の許可","advisory":null},{"id":"island-dev-tech","title":"開発技術の島","realm":"sky","exam":"マネジメント・開発技術","npc":"工房棟梁ディン","synopsis":"開発の型と技術。","enter":"開発工房で型が乾き、ディンが試作の灯を点ける。","award":"棟梁の証","advisory":null},{"id":"island-project","title":"プロジェクトの島","realm":"sky","exam":"マネジメント・プロジェクト管理","npc":"吊橋番ケイ","synopsis":"工程とWBSの橋。","enter":"吊橋が揺れ、ケイが工程表の矢石を並べる。","award":"吊橋の通行証","advisory":null},{"id":"island-service","title":"サービスの島","realm":"sky","exam":"マネジメント・サービスマネジメント","npc":"灯火番イズミ","synopsis":"サービスと障害復旧。","enter":"灯火番小屋のベルが鳴り、イズミがSLAの巻を持つ。","award":"灯火番の誓","advisory":null},{"id":"island-audit","title":"監査の島","realm":"sky","exam":"マネジメント・システム監査","npc":"記録官トモ","synopsis":"証跡と監査の書庫。","enter":"記録庫の灯が点き、トモが証跡の判子を用意する。","award":"記録官の朱","advisory":null},{"id":"gate-sky-trial","title":"空の関門","realm":"sky","exam":"午前・総合演習","npc":"関門番トリス","synopsis":"空を裂く三つの試練。","enter":"雲が裂け、トリスが三本の試練の扉を示す。","award":"空裂きの誓約","advisory":null},{"id":"fortress-algorithm","title":"アルゴリズム砦","realm":"underground","exam":"午後・アルゴリズム","npc":"衛兵長ヴェルク","synopsis":"帝国石版のトレース訓練場。","enter":"石版室に靴音。ヴェルクが「動きを追え」と囁く。","award":"石版の鑑定士","advisory":"地下は #90 以降が本編です。空の関門 #87〜89 を越えてからだと物語がつながります（強制ではありません）。"},{"id":"fortress-program","title":"プログラム砦","realm":"underground","exam":"午後・プログラミング","npc":"工房技師ザイン","synopsis":"擬似言語と構造の工房。","enter":"擬似言語の煙が立ち、ザインが石版コードを渡す。","award":"擬似言語工の章","advisory":"地下は #90 以降が本編です。空の関門 #87〜89 を越えてからだと物語がつながります（強制ではありません）。"},{"id":"fortress-database","title":"データベース砦","realm":"underground","exam":"午後・データベース","npc":"水晶管理人ダリア","synopsis":"地下のSQLとER。","enter":" function el(tag, attrs, text) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]);

}

  return 'todo';
}
function copyText(text, btn) {
  const done = () => { btn.textContent = 'コピー済'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 1400); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallback());
  } else fallback();
  function fallback() {
    const t = el('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } finally { t.remove(); }
  }
}

}

  else if (next && d.id === next.domain) d.state = 'current';

const COLS = 6, DX = 175, DY = 150, MX = 110, BAND_GAP = 46;

const realmOrder = ['sky', 'underground', 'land'];
let rowIndex = 0, y = 70;
realmOrder.forEach(realm => {
  const rs = nodes.filter(n => n.realm === realm);
  const rows = Math.ceil(rs.length / COLS);
  for (let r = 0; r < rows; r++) {
    const chunk = rs.slice(r * COLS, (r + 1) * COLS);
    const ltr = rowIndex % 2 === 0;
    chunk.forEach((n, c) => {
      const col = ltr ? c : (COLS - 1 - c);
      n.x = MX + col * DX; n.y = y + 20;
    });
    rowIndex++;
    y += DY;
  }
  y += BAND_GAP;
});

}

async function openLessonModal(noOrLesson) {
  const l = typeof noOrLesson === 'object' ? noOrLesson : lessons.find(x => x.no === noOrLesson);
  if (!l) return;
  const dom = domains.find(d => d.id === l.domain);
  const st = lessonState(l);
  const stLabel = { cleared: 'クリア済み', skipped: '迂回中', next: '次の推奨', todo: '未挑戦' }[st];
  document.getElementById('qm-kicker').textContent = (dom ? dom.title : 'クエスト') + ' · ステージ概要';
  document.getElementById('qm-title').textContent = '講座 ' + pad(l.no) + '　' + l.title;
  const meta = document.getElementById('qm-meta');
  meta.innerHTML = '';
  meta.appendChild(el('span', { class: 'tag ' + (st === 'next' ? 'current' : st === 'cleared' ? 'cleared' : st === 'skipped' ? '' : '') }, stLabel));
  if (dom) meta.appendChild(el('span', { class: 'tag' }, dom.exam || ''));
  if (missed.has(l.no)) meta.appendChild(el('span', { class: 'tag' }, '復習候補'));
  const desc = document.getElementById('qm-desc');
  desc.textContent = '読み込み中…';
  const quote = document.getElementById('qm-quote');
  quote.hidden = true;
  if (dom && dom.enter) {
    quote.hidden = false;
    quote.textContent = (dom.npc ? dom.npc + ' — ' : '') + dom.enter;
  }
  const go = document.getElementById('qm-go');
  go.href = lessonPlayHref(l.no);
  go.textContent = st === 'cleared' ? 'もう一度挑戦する' : '挑戦する';
  document.getElementById('quest-overlay').classList.add('show');

  const quests = await loadQuests();
  const full = (quests.lessons || []).find(q => q.courseNo === l.no || q.no === l.no);
  if (full) {
    const qCount = (full.questions && full.questions.length) || 0;
    let body = full.blurb ? full.blurb + '。' : (l.title + '。');
    if (dom && dom.synopsis) body += ' ' + dom.synopsis;
    if (qCount) body += '（封印の問い ' + qCount + ' 問）';
    if (st === 'cleared') body += ' すでに灯は点いています。復習としてやり直せます。';
    else if (missed.has(l.no)) body += ' 以前つまずいた記録があります。用語を確認してから挑みましょう。';
    desc.textContent = body;
  } else {
    desc.textContent = (dom && dom.synopsis ? dom.synopsis + ' ' : '') + 'スライドで学び、封印の問いに答えて灯を点けます。';
  }
}
document.getElementById('qm-close').onclick = closeLessonModal;
document.getElementById('quest-overlay').addEventListener('click', (ev) => {
  if (ev.target.id === 'quest-overlay') closeLessonModal();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeLessonModal();
});
function appendTravelerPanel(panel) {
  panel.appendChild(el('h3', null, '旅人'));
  const row = el('div', { class: 'save-row' });
  const inp = el('input', { class: 'panel-input', id: 'traveler-name', value: SAVE.displayName || '旅人', maxlength: '32' });
  const saveBtn = el('button', { class: 'panel-btn', type: 'button' }, '名前を保存');
  saveBtn.onclick = () => {
    LampSave.setDisplayName(LampSave.loadLocal(), inp.value);
    location.reload();
  };
  row.appendChild(inp);
  row.appendChild(saveBtn);
  panel.appendChild(row);
  panel.appendChild(el('h3', null, 'クラウド同期（任意）'));
  panel.appendChild(el('div', { class: 'stat' }, 'Google でログインすると、別の端末でも同じ灯を共有できます。未ログインでもこの端末だけで学べます。'));
  const authBox = el('div', { class: 'save-row', id: 'panel-auth' });
  panel.appendChild(authBox);
  if (window.LampCloud) LampCloud.mountAuthControls(authBox, { btnClass: 'panel-btn', showDisabledHint: true });
}
function appendSaveTools(panel) {
  panel.appendChild(el('h3', null, '冒険記録（この端末）'));
  panel.appendChild(el('div', { class: 'stat' }, 'JSON の出し入れでバックアップできます。インポートはブラウザ内の記録を上書きします。'));
  const row = el('div', { class: 'save-row' });
  const ex = el('button', { class: 'panel-btn', type: 'button' }, 'エクスポート');
  ex.onclick = () => LampSave.downloadExport();
  const file = el('input', { type: 'file', accept: 'application/json,.json', style: 'font-size:12px;color:var(--muted)' });
  file.onchange = () => {
    const f = file.files && file.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        LampSave.importFromJson(String(reader.result));
        alert('インポートしました。');
        location.reload();
      } catch (e) {
        alert('インポートできません: ' + e.message);
      }
    };
    reader.readAsText(f, 'UTF-8');
    file.value = '';
  };
  const reset = el('button', { class: 'panel-btn warn', type: 'button' }, '記録を消去');
  reset.onclick = () => {
    if (confirm('ブラウザ内の冒険記録を消します。よろしいですか？')) {
      LampSave.resetLocal();
      location.reload();
    }
  };
  row.appendChild(ex);
  row.appendChild(file);
  row.appendChild(reset);
  panel.appendChild(row);
}

function showHome() {
  backBtn.classList.remove('visible');
  if (worldApi && worldApi.getMode() === 'island') worldApi.exitIsland();
  panel.innerHTML = '';
  panel.appendChild(el('h2', null, '灯台の港 — 身支度'));
  panel.appendChild(el('div', { class: 'quote' }, 'ここは旅の拠点。出発前に名前を整え、つまずいた封印を復習し、次の島へ備えましょう。'));
  panel.appendChild(el('div', { class: 'stat' }, DATA.prologue));
  panel.appendChild(el('h3', null, '領域への門'));
  panel.appendChild(el('div', { class: 'stat' }, '港の三つの門、またはマップ右上から、空・陸地・地下を自由に行き来できます。全体図で諸島の配置を確認しましょう。'));
  const realmRow = el('div', { class: 'save-row' });
  [
    ['overview', '全体図'],
    ['sky', '空へ'],
    ['land', '陸へ'],
    ['underground', '地下へ']
  ].forEach(pair => {
    const b = el('button', { class: 'panel-btn', type: 'button' }, pair[1]);
    b.onclick = () => {
      if (!worldApi) return;
      if (pair[0] === 'overview') worldApi.showOverview();
      else worldApi.travelToRealm(pair[0]);
    };
    realmRow.appendChild(b);
  });
  panel.appendChild(realmRow);

  panel.appendChild(el('h3', null, 'いまの旅人'));
  panel.appendChild(el('div', { class: 'stat' },
    'Lv ' + (SAVE.level || 1) + '　／　灯 ' + cleared.size + '/' + lessons.length +
    '　／　称号 ' + ((SAVE.titles || []).length) +
    '　／　復習リスト ' + missed.size + ' 件'));

  panel.appendChild(el('h3', null, '次の推奨クエスト'));
  if (next) {
    panel.appendChild(el('div', null, '講座 ' + pad(next.no) + '　' + next.title));
    const dom = domains.find(d => d.id === next.domain);
    if (dom) panel.appendChild(el('div', { class: 'stat' }, dom.title + ' ／ ' + dom.npc));
    panel.appendChild(playLink('概要を見て出発する →', next.no));
    if (!cleared.has(next.no)) {
      const skipBtn = el('button', { class: 'panel-btn warn', type: 'button' }, '迂回して先へ（↷）');
      skipBtn.onclick = () => {
        if (confirm('講座 ' + pad(next.no) + ' を迂回します。あとで一覧から戻れます。')) {
          LampSave.registerSkip(LampSave.loadLocal(), next.no);
          const to = lessons.find(l => l.no > next.no && !cleared.has(l.no) && !skipped.has(l.no) && l.no !== next.no);
          location.href = 'map.html?arrive=1&from=' + next.no + (to ? '&to=' + to.no : '') + '&skip=1';
        }
      };
      panel.appendChild(skipBtn);
    }
  } else {
    panel.appendChild(el('div', null, 'すべての灯が揃いました。諸島の中枢が目を覚まします。'));
  }

  panel.appendChild(el('h3', null, '復習（間違えた封印）'));
  const missList = lessons.filter(l => missed.has(l.no));
  if (missList.length === 0) {
    panel.appendChild(el('div', { class: 'stat' }, 'まだ復習候補はありません。未合格になるとここに溜まります。'));
  } else {
    panel.appendChild(el('div', { class: 'stat' }, 'つまずいた講座を、スライドからやり直せます。'));
    const ul = el('ul', { class: 'lessons' });
    missList.slice(0, 12).forEach(l => ul.appendChild(lessonRow(l)));
    panel.appendChild(ul);
    if (missList.length > 12) panel.appendChild(el('div', { class: 'stat' }, 'ほか ' + (missList.length - 12) + ' 件…'));
  }

  if (skipped.size > 0) {
    panel.appendChild(el('h3', null, '迂回中（あとで戻る）'));
    const ul = el('ul', { class: 'lessons' });
    lessons.filter(l => skipped.has(l.no)).forEach(l => ul.appendChild(lessonRow(l)));
    panel.appendChild(ul);
  }

  panel.appendChild(el('h3', null, '身支度リンク'));
  const prep = el('div', { class: 'save-row' });
  prep.appendChild(el('a', { href: 'ref.html?p=glossary', class: 'panel-btn', style: 'text-decoration:none;display:inline-block' }, '用語図鑑'));
  prep.appendChild(el('a', { href: 'ref.html?p=curriculum', class: 'panel-btn', style: 'text-decoration:none;display:inline-block' }, '全講座一覧'));
  prep.appendChild(el('a', { href: 'ref.html?p=titles', class: 'panel-btn', style: 'text-decoration:none;display:inline-block' }, '称号'));
  prep.appendChild(el('a', { href: 'ref.html?p=world', class: 'panel-btn', style: 'text-decoration:none;display:inline-block' }, '世界設定'));
  panel.appendChild(prep);

  panel.appendChild(el('h3', null, '称号'));
  const t = el('div', { class: 'titles' });
  if ((SAVE.titles || []).length === 0) t.appendChild(el('div', { class: 'stat' }, 'まだありません。'));
  (SAVE.titles || []).forEach(x => t.appendChild(el('span', null, x)));
  panel.appendChild(t);

  appendTravelerPanel(panel);
  appendSaveTools(panel);

  if (next) {
    panel.appendChild(el('h3', null, 'ローカル（PowerShell）'));
    panel.appendChild(cmdBox(lessonCmd(next)));
  }
  panel.appendChild(el('h3', null, '凡例'));
  const lg = el('div', { class: 'legend' });
  lg.innerHTML = '<div><i style="background:#f5c451"></i>灯が揃った土地</div><div><i style="background:#7fd1ff"></i>いま挑んでいる土地</div><div><i style="background:#7fa6d8"></i>開いている土地</div><div><i style="background:#3a3f62"></i>霧の中</div><div>ステージクリック → 概要 → 挑戦</div>';
  panel.appendChild(lg);
}

function lessonRow(l) {
  const st = lessonState(l);
  const li = el('li', { class: st === 'next' ? 'next' : '' });
  li.appendChild(el('span', { class: 'mark ' + st }, { cleared: '✓', skipped: '↷', next: '▶', todo: '・' }[st]));
  li.appendChild(el('span', null, pad(l.no) + '　' + l.title));
  const links = el('span');
  const play = el('button', { type: 'button', class: 'copy', style: 'color:var(--open);font-weight:600;border-color:var(--open)' }, '概要');
  play.onclick = (ev) => { ev.preventDefault(); openLessonModal(l); };
  links.appendChild(play);
  links.appendChild(el('a', { href: repoLessonHref(l.path, 'PROBLEMS.md'), target: '_blank', rel: 'noopener' }, 'MD'));
  if (st === 'skipped') {
    const un = el('button', { class: 'copy', type: 'button', title: '迂回をやめる' }, '↩');
    un.onclick = (ev) => {
      ev.preventDefault();
      LampSave.unregisterSkip(LampSave.loadLocal(), l.no);
      location.reload();
    };
    links.appendChild(un);
  }
  li.appendChild(links);
  return li;
}

function showDomain(d) {
  backBtn.classList.add('visible');
  panel.innerHTML = '';
  const back = el('button', { class: 'back' }, '← 拠点へ');
  back.onclick = showHome;
  panel.appendChild(back);
  panel.appendChild(el('h2', null, d.title));
  const tags = el('div');
  const stLabel = { cleared: '灯が揃った', current: '挑戦中', open: '開いている', fog: '霧の中' }[d.state];
  tags.appendChild(el('span', { class: 'tag ' + d.state }, stLabel));
  tags.appendChild(el('span', { class: 'tag' }, d.exam));
  tags.appendChild(el('span', { class: 'tag' }, '灯 ' + d.done + '/' + d.total));
  panel.appendChild(tags);
  if (d.enter) panel.appendChild(el('div', { class: 'quote' }, d.enter));
  panel.appendChild(el('div', { class: 'stat' }, '守り手: ' + d.npc + '　／　' + d.synopsis));
  if (d.state === 'fog' && d.advisory) panel.appendChild(el('div', { class: 'warn' }, d.advisory));
  else if (d.state === 'fog') panel.appendChild(el('div', { class: 'warn' }, '推奨順ではまだ先の土地です。入ることはできますが、手前の土地から進むと物語がつながります。'));
  if (d.award) {
    panel.appendChild(el('h3', null, '完走の称号'));
    const t = el('div', { class: 'titles' }); t.appendChild(el('span', null, d.award)); panel.appendChild(t);
  }
  panel.appendChild(el('h3', null, '講座（島のステージ）'));
  const ul = el('ul', { class: 'lessons' });
  d.lessons.forEach(l => ul.appendChild(lessonRow(l)));
  panel.appendChild(ul);
  const target = d.lessons.find(l => !cleared.has(l.no) && !skipped.has(l.no)) || d.lessons[0];
  if (target) {
    panel.appendChild(el('h3', null, 'ここから始める'));
    panel.appendChild(playLink('講座 ' + pad(target.no) + ' の概要を見る', target.no));
    panel.appendChild(cmdBox(lessonCmd(target)));
  }
  if (worldApi) worldApi.enterIsland(d, lessonState);
}

function showLevelUp(level, titles) {
  const ov = document.getElementById('lv-overlay');
  const sub = document.getElementById('lv-sub');
  document.getElementById('lv-title').textContent = 'レベル ' + level + ' に到達！';
  const tierName = { novice: '旅人', adept: '灯の見習い', keeper: '灯守', ascendant: '光の継承者' };
  let tier = 'novice';
  if (level >= 11) tier = 'ascendant';
  else if (level >= 6) tier = 'keeper';
  else if (level >= 3) tier = 'adept';
  let msg = '見た目が「' + tierName[tier] + '」に変わりました。';
  if (titles && titles.length) msg += '\n称号: ' + titles.join('、');
  sub.textContent = msg;
  ov.classList.add('show');
  if (worldApi && worldApi.setAvatarLevel) worldApi.setAvatarLevel(level);
  document.getElementById('h-level').textContent = String(level);
  document.getElementById('lv-ok').onclick = () => ov.classList.remove('show');
}

backBtn.onclick = () => showHome();

showHome();

const params = new URLSearchParams(location.search);
const arrive = params.get('arrive') === '1';
const fromNo = parseInt(params.get('from'), 10) || 0;
const toNo = parseInt(params.get('to'), 10) || 0;
const levelUp = params.get('levelUp') === '1';
const awardTitles = (params.get('awards') || '').split('|').filter(Boolean);

import('./lamp-world.js?v=15').then(mod => {
  const mount = mod.mountLampWorld || (window.LampWorld && window.LampWorld.mountLampWorld);
  if (!mount) { console.error('LampWorld mount failed'); return; }
  worldApi = mount(document.getElementById('world'), {
    nodes,
    layoutW,
    layoutH,
    level: SAVE.level || 1,
    avatarCourseNo: SAVE.lastCourseNo || (next && next.no) || 1,
    lessonState,
    reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
    onSelectDomain: (d) => showDomain(d),
    onSelectHub: () => showHome(),
    onSelectLesson: (l) => { openLessonModal(l); },
    onTravelRealm: (realm) => {
      const labels = { sky: '空の諸島', land: '陸地の台地', underground: '地下の砦' };
      const tip = document.querySelector('.world-hint');
      if (tip) tip.textContent = (labels[realm] || realm) + ' へ移動 · 左右ドラッグで領域スライド · 全体図で俯瞰';
    },
    onModeChange: (mode) => {
      if (mode === 'island') backBtn.classList.add('visible');
      else backBtn.classList.remove('visible');
    }
  });
  const nav = document.getElementById('world-nav');
  if (nav) {
    nav.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-nav]');
      if (!btn || !worldApi) return;
      const act = btn.getAttribute('data-nav');
      if (act === 'overview') worldApi.showOverview();
      else if (act === 'hub') worldApi.returnToHub();
      else worldApi.travelToRealm(act);
    });
  }

  if (arrive && worldApi) {
    const fromIdx = worldApi.findNodeIndexForCourse(fromNo);
    const toIdx = toNo ? worldApi.findNodeIndexForCourse(toNo) : Math.min(fromIdx + 1, nodes.length - 1);
    worldApi.placeAvatarForProgress(fromNo);
    worldApi.walkAvatar(fromIdx, toIdx, () => {
      if (toNo) {
        const dom = domains.find(d => d.lessons.some(l => l.no === toNo));
        if (dom) showDomain(dom);
      }
      history.replaceState({}, '', 'map.html');
    });
  } else if (next) {
    const dom = domains.find(d => d.id === next.domain);
    if (dom) {
      /* stay on world overview; optional soft highlight via current state already */
    }
  }

  if (levelUp || awardTitles.length) {
    setTimeout(() => showLevelUp(SAVE.level || 1, awardTitles), arrive ? 1600 : 400);
  }
}).catch(err => {
  console.error(err);
  document.getElementById('world').appendChild(el('div', { class: 'warn', style: 'margin:16px' }, '3Dマップを読み込めませんでした。回線またはキャッシュを確認してください。'));
});
</script>
