<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171b36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="lamp-dungeon.css">
<!-- 2D ダンジョンがデフォルト。3D に戻すときは stylesheet を lamp-world.css にし import を lamp-world.js に -->
<title>Lumina Code — ワールドマップ</title>
<style>
:root {
  --bg: #0f1226; --panel: #171b36; --panel2: #1f2447; --ink: #ece9f5; --muted: #9aa0c4;
  --gold: #f5c451; --open: #7fd1ff; --fog: #3a3f62; --skip: #c59bff;
  --sky: #16305a; --ug: #2b1a3d; --land: #17382a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
  background: var(--bg); color: var(--ink);
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid #2a2f58;
}
header h1 { font-size: 15px; margin: 0; letter-spacing: .04em; flex: 1; min-width: 120px; }
.stat { font-size: 12px; color: var(--muted); }
.stat b { color: var(--ink); font-size: 13px; }
.bar { width: 72px; height: 5px; background: #2a2f58; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 4px; }
.bar i { display: block; height: 100%; background: var(--gold); }
.xp-bar { width: 56px; height: 5px; background: #2a2f58; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 4px; }
.xp-bar i { display: block; height: 100%; background: var(--open); }
main { overflow: hidden; position: relative; min-height: 0; }
.settings-btn {
  margin-left: auto; background: var(--panel2); color: var(--ink);
  border: 1px solid #343a6b; border-radius: 8px; padding: 6px 10px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.settings-btn:hover { border-color: #7fd1ff; }
.settings-btn img, .world-nav-btn img {
  width: 18px; height: 18px; object-fit: cover; border-radius: 4px; vertical-align: middle;
}
.stat-lamp { display: inline-flex; align-items: center; gap: 4px; }
.stat-lamp img { width: 16px; height: 16px; border-radius: 3px; object-fit: cover; }
.sheet-body { max-height: min(52vh, 420px); overflow-y: auto; padding: 8px 4px; }
.sheet-body h3 { font-size: 12px; color: var(--muted); margin: 14px 0 6px; letter-spacing: .06em; }
.say-box {
  /* 左下固定 — 中央の主人公・右の老人を隠さない */
  position: absolute; left: 12px; right: auto;
  bottom: 12px; z-index: 6;
  width: min(420px, calc(100% - 24px));
  max-height: min(34vh, 220px); overflow-y: auto;
  background: rgba(12, 14, 28, 0.82) url('assets/common/say-frame.jpg') center/cover no-repeat;
  border: 1px solid #3a4068; border-radius: 12px;
  padding: 10px 14px 8px; display: none; pointer-events: auto;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45);
}
.say-box::before {
  content: ''; position: absolute; inset: 0; border-radius: 12px;
  background: rgba(10, 12, 26, 0.68); pointer-events: none;
}
.say-box > * { position: relative; z-index: 1; }
.say-box.show { display: block; }
.say-speaker { font-size: 11px; color: var(--gold); margin-bottom: 4px; letter-spacing: .08em; }
.say-text { font-size: 14px; line-height: 1.5; min-height: 2.4em; color: var(--ink); white-space: pre-wrap; }
.say-cursor { display: inline-block; width: 0.55em; color: var(--open); animation: blink 0.9s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.say-hint { margin-top: 6px; font-size: 11px; color: var(--muted); text-align: right; }
.say-actions { display: none; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.say-actions.show { display: flex; }
.say-actions button, .say-actions a {
  font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px;
  border: 1px solid #343a6b; background: var(--panel2); color: var(--ink); text-decoration: none; cursor: pointer;
}
.say-actions button.primary, .say-actions a.primary { border-color: var(--open); color: #dff6ff; }
.say-actions button.is-focus, .say-actions a.is-focus {
  outline: 2px solid var(--gold); outline-offset: 2px;
  box-shadow: 0 0 0 3px rgba(245, 196, 81, 0.28);
}
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); color: var(--muted); margin-right: 6px; }
.tag.cleared { color: #1a1300; background: var(--gold); }
.tag.current { color: #00121d; background: var(--open); }
.tag.fog { background: var(--fog); }
.quote { border-left: 3px solid var(--open); padding: 6px 10px; margin: 10px 0; color: #cfd6f3; background: #141836; font-size: 14px; }
.warn { border-left: 3px solid #e0a040; padding: 6px 10px; margin: 10px 0; background: #2a2210; color: #f0d6a0; font-size: 13px; }
.cmd { display: flex; gap: 6px; align-items: center; background: #0b0e1f; border: 1px solid #2a2f58; border-radius: 6px; padding: 8px 10px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; margin: 6px 0; }
.cmd code { flex: 1; white-space: pre-wrap; word-break: break-all; }
button { font: inherit; cursor: pointer; }
.copy { background: var(--panel2); color: var(--ink); border: 1px solid #343a6b; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
.copy.done { color: var(--gold); border-color: var(--gold); }
.panel-btn { background: var(--panel2); color: var(--ink); border: 1px solid #343a6b; border-radius: 6px; padding: 6px 12px; font-size: 13px; margin: 4px 6px 4px 0; }
.panel-btn.warn { border-color: #c59bff; color: #e8d4ff; }
.panel-input { background: #0b0e1f; color: var(--ink); border: 1px solid #343a6b; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 14px; width: min(100%, 220px); }
.save-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
ul.lessons { list-style: none; padding: 0; margin: 0; }
ul.lessons li { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 6px 4px; border-bottom: 1px solid #23284c; font-size: 14px; }
ul.lessons li.is-focus { outline: 2px solid var(--gold); background: #1a2440; }
ul.lessons li.next { background: #13283a; }
.qm-actions button.is-focus, .qm-actions a.is-focus {
  outline: 2px solid var(--gold); outline-offset: 2px;
}
.mark { text-align: center; font-weight: bold; }
.mark.cleared { color: var(--gold); }
.mark.skipped { color: var(--skip); }
.mark.next { color: var(--open); }
.mark.todo { color: #565c86; }
ul.lessons a { color: var(--muted); font-size: 12px; margin-left: 6px; }
ul.lessons a:hover { color: var(--ink); }
.titles span { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 10px; background: #2a2410; color: var(--gold); font-size: 12px; }
.back { background: none; border: none; color: var(--open); padding: 0; font-size: 13px; }
.legend { font-size: 12px; color: var(--muted); line-height: 1.9; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.hm-growth { margin: 10px 0 14px; display: grid; gap: 6px; }
.hm-growth-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.hm-growth-label { min-width: 72px; color: var(--ink); }
.hm-growth-bar { flex: 1; height: 8px; background: #0b0e1f; border-radius: 4px; overflow: hidden; border: 1px solid #343a6b; }
.hm-growth-bar i { display: block; height: 100%; }
.world-hint {
  left: 12px; right: auto; bottom: auto; top: 52px;
  max-width: min(320px, calc(100% - 24px));
}
.notes-overlay, .gallery-overlay {
  position: fixed; inset: 0; z-index: 90; display: none;
  align-items: center; justify-content: center;
  background: rgba(6, 8, 18, 0.72);
}
.notes-overlay.show, .gallery-overlay.show { display: flex; }
.notes-card, .gallery-card {
  width: min(640px, calc(100% - 24px)); max-height: min(80vh, 720px);
  background: var(--panel); border: 1px solid #343a6b; border-radius: 14px;
  padding: 14px 16px; box-shadow: 0 16px 40px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 10px;
}
.notes-card h2, .gallery-card h2 { margin: 0; font-size: 16px; color: var(--gold); }
.notes-card textarea {
  width: 100%; min-height: 280px; resize: vertical; flex: 1;
  background: #0b0e1f; color: var(--ink); border: 1px solid #343a6b;
  border-radius: 8px; padding: 10px; font: inherit; font-size: 14px; line-height: 1.5;
}
.notes-meta { font-size: 11px; color: var(--muted); }
.gallery-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.gallery-tabs button {
  font: inherit; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px;
  border: 1px solid #343a6b; background: var(--panel2); color: var(--ink); cursor: pointer;
}
.gallery-tabs button.active { border-color: var(--gold); color: var(--gold); }
.gallery-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 10px; overflow-y: auto; padding: 4px 2px 8px;
}
.gallery-item {
  background: #0b0e1f; border: 1px solid #2a2f58; border-radius: 10px;
  padding: 8px 6px; text-align: center;
}
.gallery-item.locked { opacity: 0.35; filter: grayscale(1); }
.gallery-item img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto 6px; }
.gallery-item .lv { font-size: 11px; color: var(--muted); font-weight: 700; }
.gallery-item.current { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(245,196,81,.35); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
@media (max-width: 900px) {
  header h1 { font-size: 14px; }
  .say-box { left: 8px; right: auto; bottom: 8px; width: min(360px, calc(100% - 16px)); max-height: min(32vh, 200px); }
}
@media (prefers-reduced-motion: reduce) {
  .say-cursor { animation: none; }
}
</style>
</head>
<body>
<header>
  <h1>三つの扉</h1>
  <span class="stat stat-lamp"><img src="assets/common/icon-lamp.png" alt="" width="16" height="16">灯 <b id="h-lamps"></b><span class="bar"><i id="h-bar"></i></span></span>
  <span class="stat" id="h-name" hidden></span>
  <span class="stat" id="h-titles" hidden></span>
  <span class="stat" id="h-sync" hidden></span>
  <span class="stat" id="h-auth" hidden></span>
  <button type="button" class="settings-btn" id="notes-btn" title="修正メモ"><img src="assets/common/icon-notes.jpg" alt="">ノート</button>
  <button type="button" class="settings-btn" id="gallery-btn" title="成長ギャラリー">ギャラリー</button>
  <button type="button" class="settings-btn" id="settings-btn" aria-haspopup="dialog"><img src="assets/common/icon-settings.png" alt="">設定</button>
</header>
<main>
  <div class="world-wrap" id="world">
    <button type="button" class="world-back-btn" id="world-back">← 間へ</button>
    <div class="world-nav" id="world-nav" role="toolbar" aria-label="進路ナビ">
      <button type="button" class="world-nav-btn" data-nav="overview"><img src="assets/common/icon-map.png" alt="">全体</button>
      <button type="button" class="world-nav-btn realm sky" data-nav="sky"><img src="assets/common/icon-shield.png" alt="">盾</button>
      <button type="button" class="world-nav-btn realm land" data-nav="land">扉</button>
      <button type="button" class="world-nav-btn realm underground" data-nav="underground"><img src="assets/common/icon-sword.png" alt="">剣</button>
      <button type="button" class="world-nav-btn" data-nav="hub">間</button>
    </div>
    <div class="world-hint" id="world-hint">[ ] 前後の扉　F この扉　セリフは↑↓とEnter</div>
    <div class="say-box" id="say-box" role="dialog" aria-live="polite">
      <div class="say-speaker" id="say-speaker"></div>
      <div class="say-text" id="say-text"></div>
      <div class="say-hint" id="say-hint">クリック／Enter で進む</div>
      <div class="say-actions" id="say-actions"></div>
    </div>
  </div>
</main>
<aside id="panel" hidden aria-hidden="true"></aside>
<!-- デバッグノート UI は lamp-debug-notes.js が生成 -->
<div class="gallery-overlay" id="gallery-overlay" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
  <div class="gallery-card">
    <h2 id="gallery-title">成長の証ギャラリー</h2>
    <div class="gallery-tabs" id="gallery-tabs">
      <button type="button" data-gkey="shield" class="active">盾</button>
      <button type="button" data-gkey="sword">剣</button>
      <button type="button" data-gkey="spirit">精神</button>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
    <div class="modal-actions">
      <button type="button" class="panel-btn" id="gallery-close">とじる</button>
    </div>
  </div>
</div>
<div class="lv-overlay" id="lv-overlay" role="dialog" aria-modal="true" aria-labelledby="lv-title">
  <div class="lv-card">
    <div class="lv-emoji"><img src="assets/common/fx-level-up.png" alt="" width="72" height="72" style="border-radius:12px;object-fit:cover"></div>
    <h2 id="lv-title">レベルアップ！</h2>
    <p class="lv-sub" id="lv-sub"></p>
    <button type="button" id="lv-ok">つづける</button>
  </div>
</div>
<div class="quest-overlay" id="quest-overlay" role="dialog" aria-modal="true" aria-labelledby="qm-title">
  <div class="quest-modal">
    <div class="qm-top">
      <div class="qm-kicker" id="qm-kicker">クエスト概要</div>
      <h2 id="qm-title">講座</h2>
    </div>
    <div class="qm-body">
      <div class="qm-meta" id="qm-meta"></div>
      <p class="qm-desc" id="qm-desc"></p>
      <div class="qm-quote" id="qm-quote" hidden></div>
    </div>
    <div class="qm-actions">
      <button type="button" class="ghost" id="qm-close">やめる</button>
      <a class="primary" id="qm-go" href="#">挑戦する</a>
    </div>
  </div>
</div>
<div class="quest-overlay" id="hub-overlay" hidden aria-hidden="true"></div>
<div class="quest-overlay" id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="st-title">
  <div class="quest-modal hub-modal">
    <div class="qm-top">
      <div class="qm-kicker">メニュー</div>
      <h2 id="st-title">設定</h2>
    </div>
    <div class="qm-body sheet-body" id="settings-body"></div>
    <div class="qm-actions">
      <button type="button" class="ghost" id="settings-close">とじる</button>
    </div>
  </div>
</div>
<div class="quest-overlay" id="domain-overlay" role="dialog" aria-modal="true" aria-labelledby="dm-title">
  <div class="quest-modal hub-modal">
    <div class="qm-top">
      <div class="qm-kicker" id="dm-kicker">分野</div>
      <h2 id="dm-title">分野</h2>
    </div>
    <div class="qm-body">
      <div class="qm-meta" id="dm-meta"></div>
      <div class="sheet-body" id="dm-list"></div>
    </div>
    <div class="qm-actions">
      <button type="button" class="ghost" id="dm-close">とじる</button>
    </div>
  </div>
</div>

const MAP_W = 2800, MAP_H = 1800, GEO_MARGIN = 80, MAP_FIT_MARGIN = 56;
function accordionCenters(n, origin, opts) {
  const cell = opts.cell, gap = opts.gap, colsPrefer = opts.colsPrefer, side = opts.side, baseOut = opts.baseOut;
  const step = cell + gap;
  const rows = Math.ceil(n / Math.max(1, colsPrefer));
  const pts = [];
  for (let i = 0; i < n; i++) {
    const col = Math.floor(i / rows);
    const rowInCol = i % rows;
    const row = col % 2 === 0 ? rowInCol : rows - 1 - rowInCol;
    pts.push({
      x: origin.x + side * (baseOut + col * step),
      y: origin.y - (row + 1) * step,
      w: cell,
      h: cell
    });
  }
  return pts;
}
function fitMapPoints(hub, lists, goal, marginPx) {
  const rooms = lists.flat().concat([goal]);
  let minX = hub.x - hub.r, maxX = hub.x + hub.r, minY = hub.y - hub.r, maxY = hub.y + hub.r;
  rooms.forEach((r) => {
    const hw = (r.w || 68) / 2, hh = (r.h || 68) / 2;
    minX = Math.min(minX, r.x - hw); maxX = Math.max(maxX, r.x + hw);
    minY = Math.min(minY, r.y - hh); maxY = Math.max(maxY, r.y + hh);
  });
  const bw = Math.max(1, maxX - minX), bh = Math.max(1, maxY - minY);
  const scale = Math.min((MAP_W - marginPx * 2) / bw, (MAP_H - marginPx * 2) / bh);
  const ox = (MAP_W - bw * scale) / 2 - minX * scale;
  const oy = (MAP_H - bh * scale) / 2 - minY * scale;
  const map1 = (p) => ({ x: p.x * scale + ox, y: p.y * scale + oy });
  return {
    hub: { x: hub.x * scale + ox, y: hub.y * scale + oy },
    lists: lists.map((arr) => arr.map(map1)),
    goal: map1(goal)
  };
}

function splitSayPages(text) {
  const raw = String(text || '').replace(/\s+/g, ' ').trim();
  if (!raw) return [''];
  const parts = [];
  let chunk = '';
  for (let n = 0; n < raw.length; n++) {
    chunk += raw[n];
    if (/[。！？!?]/.test(raw[n])) {
      parts.push(chunk.trim());
      chunk = '';
    }
  }
  if (chunk.trim()) parts.push(chunk.trim());
  const pages = [];
  let buf = '';
  parts.forEach(p => {
    if ((buf + p).length > 42 && buf) {
      pages.push(buf);
      buf = p;
    } else buf += p;
  });
  if (buf) pages.push(buf);
  return pages.length ? pages : [raw];
}

}
function syncSayActionFocus() {

function runSay(pages, opts) {
  opts = opts || {};
  stopSay();
  closeLessonModal();
  closeSettings();
  closeDomainSheet();
  const list = Array.isArray(pages) ? pages.filter(Boolean) : splitSayPages(pages);
  saySpeaker.textContent = opts.speaker || '';

  sayActions.classList.remove('show');
  sayActions.innerHTML = '';
  sayHint.style.display = '';
  sayHint.textContent = 'クリック／Enter で進む';
  let page = 0;
  let i = 0;
  let full = list[0] || '';
  sayJob = { page, list, opts, done: false, timer: null };

  function paint(partial) {
    sayText.textContent = partial;
    if (!sayJob.done && partial.length < full.length) {
      const cur = el('span', { class: 'say-cursor' }, '▍');
      sayText.appendChild(cur);
    }
  }

  function startPage() {
    full = list[page] || '';
    i = 0;
    sayJob.done = false;
    if (reducedSay || !full) {
      paint(full);
      sayJob.done = true;
      return;
    }
    paint('');
    sayJob.timer = setInterval(() => {
      i += 1;
      paint(full.slice(0, i));
      if (i >= full.length) {
        clearInterval(sayJob.timer);
        sayJob.timer = null;
        sayJob.done = true;
      }
    }, 28);
  }

  function finishAll() {
    stopSay();
    sayJob = { done: true, finished: true };
    paint(list[list.length - 1] || '');
    if (opts.actions && opts.actions.length) renderSayActions(opts.actions);
    else {
      sayHint.textContent = 'クリックで閉じる';
      sayJob.closeOnNext = true;
    }
    if (opts.onDone) opts.onDone();
  }

  function advance() {
    if (!sayBox.classList.contains('show')) return;
    if (sayJob && sayJob.closeOnNext) { hideSay(); return; }
    if (!sayJob || sayJob.finished) return;
    if (!sayJob.done) {
      if (sayJob.timer) clearInterval(sayJob.timer);
      sayJob.timer = null;
      paint(full);
      sayJob.done = true;
      return;
    }
    if (page < list.length - 1) {
      page += 1;
      sayJob.page = page;
      startPage();
      return;
    }
    finishAll();
  }

  sayJob.advance = advance;
  startPage();
}

async function openLessonModal(noOrLesson) {
  const l = typeof noOrLesson === 'object' ? noOrLesson : lessons.find(x => x.no === noOrLesson);
  if (!l) return;
  closeSettings();
  closeDomainSheet();
  hideSay();
  const dom = domains.find(d => d.id === l.domain);
  const play = LampProgress.lessonPlayable(l, dom, cleared, skipped);
  const st = lessonState(l);
  const stLabel = { cleared: 'クリア済み', skipped: '迂回中', next: '次の推奨', todo: '未挑戦' }[st];
  document.getElementById('qm-kicker').textContent = (dom ? dom.title : 'クエスト') + ' · ステージ概要';
  document.getElementById('qm-title').textContent = '講座 ' + pad(l.no) + '　' + l.title;
  const meta = document.getElementById('qm-meta');
  meta.innerHTML = '';
  meta.appendChild(el('span', { class: 'tag ' + (st === 'next' ? 'current' : st === 'cleared' ? 'cleared' : st === 'skipped' ? '' : '') }, stLabel));
  if (dom) meta.appendChild(el('span', { class: 'tag' }, dom.exam || ''));
  if (missed.has(l.no)) meta.appendChild(el('span', { class: 'tag' }, '復習候補'));
  if (!play.ok) meta.appendChild(el('span', { class: 'tag fog' }, '未開放'));
  const desc = document.getElementById('qm-desc');
  desc.textContent = '';
  const quote = document.getElementById('qm-quote');
  quote.hidden = true;
  const go = document.getElementById('qm-go');
  if (!play.ok) {
    go.removeAttribute('href');
    go.textContent = 'まだ挑戦できない';
    go.onclick = (ev) => { ev.preventDefault(); runSay(play.reason, { speaker: '案内', actions: [{ label: 'とじる', onClick: () => {} }] }); };
  } else {
    go.onclick = null;
    go.href = lessonPlayHref(l.no);
    go.textContent = st === 'cleared' ? 'もう一度' : '挑戦する';
  }
  document.getElementById('quest-overlay').classList.add('show');
  questActionFocus = 0;
  syncQuestActionFocus();

  const quests = await loadQuests();
  const full = (quests.lessons || []).find(q => q.courseNo === l.no || q.no === l.no);
  let body = '';
  if (!play.ok) body = play.reason;
  else if (full && full.blurb) body = full.blurb;
  else body = 'スライドで学び、問いに答えて灯を点ける。';
  if (st === 'cleared') body += '（復習可）';
  // モーダル内も流して表示
  let i = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) desc.textContent = body;
  else {
    const t = setInterval(() => {
      i += 1;
      desc.textContent = body.slice(0, i);
      if (i >= body.length) clearInterval(t);
    }, 22);
  }
}

function syncDomainLessonFocus() {

  domainLessonFocus = Math.max(0, Math.min(rows.length - 1, domainLessonFocus));
  rows.forEach((li, i) => li.classList.toggle('is-focus', i === domainLessonFocus));
  const focused = rows[domainLessonFocus];
  if (focused && focused.scrollIntoView) focused.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('keydown', (ev) => {
  // ノート編集中はゲーム側のキーをすべて止める（Enter=改行専用）
  if (LampDebugNotes.isOpen()) {
    if (ev.key === 'Escape') {
      ev.preventDefault();
      LampDebugNotes.close();
    }
    return;
  }
  const tag = (ev.target && ev.target.tagName) || '';
  if (tag === 'TEXTAREA' || tag === 'INPUT' || (ev.target && ev.target.isContentEditable)) {
    return;
  }
  if (ev.key === 'Escape') {
    closeLessonModal();
    closeSettings();
    closeDomainSheet();
    hideSay();
    return;
  }
  if (document.getElementById('gallery-overlay') && document.getElementById('gallery-overlay').classList.contains('show')) return;
  if (document.getElementById('settings-overlay').classList.contains('show')) return;

  // セリフ中は他UI（分野一覧・クエストモーダル・ワールド操作）へキーを渡さない
  if (sayBox.classList.contains('show')) {
    const actionsOpen = sayActions.classList.contains('show') && sayActions.children.length > 0;
    if (actionsOpen) {
      if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') {
        ev.preventDefault();
        sayActionFocus -= 1;
        syncSayActionFocus();
        return;
      }
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') {
        ev.preventDefault();
        sayActionFocus += 1;
        syncSayActionFocus();
        return;
      }
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        activateSayActionFocus();
        return;
      }
      return;
    }
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      if (sayJob && sayJob.advance) sayJob.advance();
    }
    return;
  }

  const domainOpen = document.getElementById('domain-overlay').classList.contains('show');
  if (domainOpen) {
    const rows = document.querySelectorAll('#dm-list ul.lessons li');
    if (rows.length) {
      if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') {
        ev.preventDefault();
        domainLessonFocus -= 1;
        syncDomainLessonFocus();
        return;
      }
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') {
        ev.preventDefault();
        domainLessonFocus += 1;
        syncDomainLessonFocus();
        return;
      }
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        activateDomainLessonFocus();
        return;
      }
    }
  }

  const questOpen = document.getElementById('quest-overlay').classList.contains('show');
  if (questOpen) {
    if (ev.key === 'ArrowUp' || ev.key === 'ArrowLeft') {
      ev.preventDefault();
      questActionFocus -= 1;
      syncQuestActionFocus();
      return;
    }
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') {
      ev.preventDefault();
      questActionFocus += 1;
      syncQuestActionFocus();
      return;
    }
    if (ev.key === 'Enter' || ev.key === ' ') {
      ev.preventDefault();
      activateQuestActionFocus();
      return;
    }
    return;
  }

    const domainDone = !!(fromDom && LampProgress.domainFullyCleared(fromDom, cleared));
    const growthKey = fromDom && fromDom.realm === 'sky' ? 'shield'
      : fromDom && fromDom.realm === 'underground' ? 'sword'
      : fromDom && fromDom.realm === 'land' ? 'spirit'
      : null;
    const goNext = () => {
      if (toNo) {
        const L = lessons.find(l => l.no === toNo);
        if (toDom) {
          worldApi.enterIsland(toDom, lessonState);
          if (L) setTimeout(() => openLessonModal(L), 200);
          else showDomain(toDom);
        }
      } else if (fromDom) {
        showDomain(fromDom);
      }
      history.replaceState({}, '', 'map.html');
    };
    const afterDoor = () => {
      if (domainDone && growthKey && worldApi.playGrowthLevelUpThen) {
        worldApi.playGrowthLevelUpThen(growthKey, goNext);
      } else {
        goNext();
      }
    };
    if (playDom) {
      worldApi.placeAvatarForProgress(fromNo || toNo);
      // 扉演出は全講座クリア時のみ、クリアした扉の部屋で再生
      if (doorFx && domainDone && fromDom && worldApi.playClearDoorThen) {
        worldApi.enterIsland(fromDom, lessonState);
        worldApi.playClearDoorThen(afterDoor);
      } else {
        worldApi.enterIsland(playDom, lessonState);
        goNext();
      }
    } else {
      history.replaceState({}, '', 'map.html');
    }
  }

  // 初回だけ短い案内
  if (!SAVE.lastCourseNo && !arrive) {
    setTimeout(() => {
      if (!sayBox.classList.contains('show')) {
        runSay(['ここは三つの扉の間。', '老人に話しかけてみよう。'], {
          speaker: '案内',
          actions: [{ label: 'わかった', onClick: () => {} }]
        });
      }
    }, 500);
  }
}).catch(err => {
  console.error(err);
  const msg = (err && err.message) ? String(err.message) : 'unknown';
  document.getElementById('world').appendChild(el('div', { class: 'warn', style: 'margin:16px' },
    'マップを読めませんでした。再読み込みしてください。（' + msg + '）'));
});
</script>
</body>
</html>
