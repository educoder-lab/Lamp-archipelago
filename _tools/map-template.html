<title>Lumina Code — ワールドマップ</title>
<style>
:root {
  --bg: #0f1226; --panel: #171b36; --panel2: #1f2447; --ink: #ece9f5; --muted: #9aa0c4;
  --gold: #f5c451; --open: #7fd1ff; --fog: #3a3f62; --skip: #c59bff;
  --sky: #16305a; --ug: #2b1a3d; --land: #17382a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
  background: var(--bg); color: var(--ink);
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid #2a2f58;
}
header h1 { font-size: 15px; margin: 0; letter-spacing: .04em; flex: 1; min-width: 120px; }
.stat { font-size: 12px; color: var(--muted); }
.stat b { color: var(--ink); font-size: 13px; }
.bar { width: 72px; height: 5px; background: #2a2f58; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 4px; }
.bar i { display: block; height: 100%; background: var(--gold); }
.xp-bar { width: 56px; height: 5px; background: #2a2f58; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 4px; }
.xp-bar i { display: block; height: 100%; background: var(--open); }
main { overflow: hidden; position: relative; min-height: 0; }
.settings-btn {
  margin-left: auto; background: var(--panel2); color: var(--ink);
  border: 1px solid #343a6b; border-radius: 8px; padding: 6px 10px; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px;
}
.settings-btn:hover { border-color: #7fd1ff; }
.settings-btn img, .world-nav-btn img {
  width: 18px; height: 18px; object-fit: cover; border-radius: 4px; vertical-align: middle;
}
.stat-lamp { display: inline-flex; align-items: center; gap: 4px; }
.stat-lamp img { width: 16px; height: 16px; border-radius: 3px; object-fit: cover; }
.sheet-body { max-height: min(52vh, 420px); overflow-y: auto; padding: 8px 4px; }
.sheet-body h3 { font-size: 12px; color: var(--muted); margin: 14px 0 6px; letter-spacing: .06em; }
.say-box {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 6;
  background: rgba(12, 14, 28, 0.88) url('assets/common/say-frame.jpg') center/cover no-repeat;
  border: 1px solid #3a4068; border-radius: 12px;
  padding: 12px 14px 10px; display: none; pointer-events: auto;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45);
}
.say-box::before {
  content: ''; position: absolute; inset: 0; border-radius: 12px;
  background: rgba(10, 12, 26, 0.72); pointer-events: none;
}
.say-box > * { position: relative; z-index: 1; }
.say-box.show { display: block; }
.say-speaker { font-size: 11px; color: var(--gold); margin-bottom: 4px; letter-spacing: .08em; }
.say-text { font-size: 15px; line-height: 1.55; min-height: 3.2em; color: var(--ink); white-space: pre-wrap; }
.say-cursor { display: inline-block; width: 0.55em; color: var(--open); animation: blink 0.9s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.say-hint { margin-top: 6px; font-size: 11px; color: var(--muted); text-align: right; }
.say-actions { display: none; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.say-actions.show { display: flex; }
.say-actions button, .say-actions a {
  font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px;
  border: 1px solid #343a6b; background: var(--panel2); color: var(--ink); text-decoration: none; cursor: pointer;
}
.say-actions button.primary, .say-actions a.primary { border-color: var(--open); color: #dff6ff; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--panel2); color: var(--muted); margin-right: 6px; }
.tag.cleared { color: #1a1300; background: var(--gold); }
.tag.current { color: #00121d; background: var(--open); }
.tag.fog { background: var(--fog); }
.quote { border-left: 3px solid var(--open); padding: 6px 10px; margin: 10px 0; color: #cfd6f3; background: #141836; font-size: 14px; }
.warn { border-left: 3px solid #e0a040; padding: 6px 10px; margin: 10px 0; background: #2a2210; color: #f0d6a0; font-size: 13px; }
.cmd { display: flex; gap: 6px; align-items: center; background: #0b0e1f; border: 1px solid #2a2f58; border-radius: 6px; padding: 8px 10px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; margin: 6px 0; }
.cmd code { flex: 1; white-space: pre-wrap; word-break: break-all; }
button { font: inherit; cursor: pointer; }
.copy { background: var(--panel2); color: var(--ink); border: 1px solid #343a6b; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
.copy.done { color: var(--gold); border-color: var(--gold); }
.panel-btn { background: var(--panel2); color: var(--ink); border: 1px solid #343a6b; border-radius: 6px; padding: 6px 12px; font-size: 13px; margin: 4px 6px 4px 0; }
.panel-btn.warn { border-color: #c59bff; color: #e8d4ff; }
.panel-input { background: #0b0e1f; color: var(--ink); border: 1px solid #343a6b; border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 14px; width: min(100%, 220px); }
.save-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
ul.lessons { list-style: none; padding: 0; margin: 0; }
ul.lessons li { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: center; padding: 6px 4px; border-bottom: 1px solid #23284c; font-size: 14px; }
ul.lessons li.next { background: #13283a; }
.mark { text-align: center; font-weight: bold; }
.mark.cleared { color: var(--gold); }
.mark.skipped { color: var(--skip); }
.mark.next { color: var(--open); }
.mark.todo { color: #565c86; }
ul.lessons a { color: var(--muted); font-size: 12px; margin-left: 6px; }
ul.lessons a:hover { color: var(--ink); }
.titles span { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 10px; background: #2a2410; color: var(--gold); font-size: 12px; }
.back { background: none; border: none; color: var(--open); padding: 0; font-size: 13px; }
.legend { font-size: 12px; color: var(--muted); line-height: 1.9; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.hm-growth { margin: 10px 0 14px; display: grid; gap: 6px; }
.hm-growth-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.hm-growth-label { min-width: 72px; color: var(--ink); }
.hm-growth-bar { flex: 1; height: 8px; background: #0b0e1f; border-radius: 4px; overflow: hidden; border: 1px solid #343a6b; }
.hm-growth-bar i { display: block; height: 100%; }
@media (max-width: 900px) {
  header h1 { font-size: 14px; }
  .say-box { left: 8px; right: 8px; bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .say-cursor { animation: none; }
}
</style>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="save-data.js"></script>

<script src="lamp-pwa.js"></script>
<script>
const DATA = /*__LAMP_DATA__*/null;
const SAVE = LampSave.loadMerged();
LampSave.syncLevel(SAVE);
const cleared = new Set(SAVE.clearedNos || []);
const skipped = new Set((SAVE.skippedNos || []).filter(n => !cleared.has(n)));
const missed = new Set(SAVE.missedNos || []);
const lessons = DATA.lessons;
let questsCache = null;

async function loadQuests() {
  if (questsCache) return questsCache;
  try {
    const res = await fetch('data/quests.json', { cache: 'no-cache' });
    questsCache = await res.json();
  } catch (e) {
    questsCache = { lessons: [] };
  }
  return questsCache;
}

function el(tag, attrs, text) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k]; else e.setAttribute(k, attrs[k]);
  }
  if (text != null) e.textContent = text;
  return e;
}
function pad(n) { return n < 10 ? '0' + n : String(n); }
function lessonState(l) {
  if (cleared.has(l.no)) return 'cleared';
  if (skipped.has(l.no)) return 'skipped';
  if (next && l.no === next.no) return 'next';
  return 'todo';
}
function copyText(text, btn) {
  const done = () => { btn.textContent = 'コピー済'; btn.classList.add('done'); setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 1400); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallback());
  } else fallback();
  function fallback() {
    const t = el('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } finally { t.remove(); }
  }
}
const ON_HOSTED_SITE = /(?:github\.io|vercel\.app)$/i.test(location.hostname);
function repoLessonHref(path, file) {
  if (ON_HOSTED_SITE && DATA.githubRepo) {
    return 'https://github.com/' + DATA.githubRepo + '/blob/main/' + path + '/' + file;
  }
  return '../' + path + '/' + file;
}

function cmdBox(text) {
  const box = el('div', { class: 'cmd' });
  box.appendChild(el('code', null, text));
  const b = el('button', { class: 'copy' }, 'コピー');
  b.onclick = () => copyText(text, b);
  box.appendChild(b);
  return box;
}

const domains = DATA.domains.map(d => {
  const ls = lessons.filter(l => l.domain === d.id).slice().sort((a, b) => a.no - b.no);
  const done = ls.filter(l => cleared.has(l.no)).length;
  return Object.assign({}, d, { lessons: ls, done, total: ls.length });
});
const progressGate = LampProgress.applyDomainStates(domains, cleared, null);
const landOpen = progressGate.landOpen;
const next = lessons.find(l => {
  if (cleared.has(l.no) || skipped.has(l.no)) return false;
  const dom = domains.find(d => d.id === l.domain);
  return LampProgress.lessonPlayable(l, dom, cleared, skipped).ok;
}) || null;
if (next) {
  const nd = domains.find(d => d.id === next.domain);
  if (nd && nd.state === 'open') nd.state = 'current';
}

const allDone = lessons.length > 0 && lessons.every(l => cleared.has(l.no));

const growth = LampProgress.growthRanks(domains, cleared);

const nodes = [];
nodes.push({ kind: 'hub', realm: 'land', label: '三つの扉の間', sub: '老人・手引き', state: 'cleared' });
domains.forEach(d => nodes.push({ kind: 'domain', realm: d.realm, label: d.title, sub: d.done + '/' + d.total, state: d.state, d }));
nodes.push({ kind: 'core', realm: 'land', label: '中枢の間', sub: allDone ? '再起動' : '最終目的地', state: allDone ? 'cleared' : 'fog' });

// 案A じゃばら：map/bg.jpg・docs/data/map-layout.json と同一座標（画像px）。MARGIN=80 を引いて n.x へ。
const MAP_W = 2800, MAP_H = 1800, GEO_MARGIN = 80, MAP_FIT_MARGIN = 56;
function accordionCenters(n, origin, opts) {
  const cell = opts.cell, gap = opts.gap, colsPrefer = opts.colsPrefer, side = opts.side, baseOut = opts.baseOut;
  const step = cell + gap;
  const rows = Math.ceil(n / Math.max(1, colsPrefer));
  const pts = [];
  for (let i = 0; i < n; i++) {
    const col = Math.floor(i / rows);
    const rowInCol = i % rows;
    const row = col % 2 === 0 ? rowInCol : rows - 1 - rowInCol;
    pts.push({
      x: origin.x + side * (baseOut + col * step),
      y: origin.y - (row + 1) * step,
      w: cell,
      h: cell
    });
  }
  return pts;
}
function fitMapPoints(hub, lists, goal, marginPx) {
  const rooms = lists.flat().concat([goal]);
  let minX = hub.x - hub.r, maxX = hub.x + hub.r, minY = hub.y - hub.r, maxY = hub.y + hub.r;
  rooms.forEach((r) => {
    const hw = (r.w || 68) / 2, hh = (r.h || 68) / 2;
    minX = Math.min(minX, r.x - hw); maxX = Math.max(maxX, r.x + hw);
    minY = Math.min(minY, r.y - hh); maxY = Math.max(maxY, r.y + hh);
  });
  const bw = Math.max(1, maxX - minX), bh = Math.max(1, maxY - minY);
  const scale = Math.min((MAP_W - marginPx * 2) / bw, (MAP_H - marginPx * 2) / bh);
  const ox = (MAP_W - bw * scale) / 2 - minX * scale;
  const oy = (MAP_H - bh * scale) / 2 - minY * scale;
  const map1 = (p) => ({ x: p.x * scale + ox, y: p.y * scale + oy });
  return {
    hub: { x: hub.x * scale + ox, y: hub.y * scale + oy },
    lists: lists.map((arr) => arr.map(map1)),
    goal: map1(goal)
  };
}
function applyPx(node, px, py) {
  node.x = px - GEO_MARGIN;
  node.y = py - GEO_MARGIN;
}
const hubRaw = { x: MAP_W / 2, y: MAP_H - 220, r: 96 };
const originPx = { x: hubRaw.x, y: hubRaw.y - hubRaw.r };
const shieldRaw = accordionCenters(17, originPx, { side: -1, colsPrefer: 3, cell: 68, gap: 24, baseOut: 260 });
const swordRaw = accordionCenters(6, originPx, { side: 1, colsPrefer: 2, cell: 68, gap: 24, baseOut: 260 });
const spiritRaw = [];
{
  const cell = 84, gap = 40, step = cell + gap;
  for (let i = 0; i < 3; i++) spiritRaw.push({ x: originPx.x, y: originPx.y - (i + 1) * step - 10, w: cell, h: cell });
}
const goalRaw = { x: spiritRaw[2].x, y: spiritRaw[2].y - 140, w: 140, h: 116 };
const fitted = fitMapPoints(hubRaw, [shieldRaw, swordRaw, spiritRaw], goalRaw, MAP_FIT_MARGIN);
const hubPx = fitted.hub;
const shieldPx = fitted.lists[0];
const swordPx = fitted.lists[1];
const spiritPx = fitted.lists[2];
const goalPx = fitted.goal;

const hubLayout = nodes.find(n => n.kind === 'hub');
if (hubLayout) applyPx(hubLayout, hubPx.x, hubPx.y);

const skyNodes = nodes.filter(n => n.kind === 'domain' && n.realm === 'sky');
const ugNodes = nodes.filter(n => n.kind === 'domain' && n.realm === 'underground');
const landNodes = nodes.filter(n => n.kind === 'domain' && n.realm === 'land');
skyNodes.forEach((n, i) => { if (shieldPx[i]) applyPx(n, shieldPx[i].x, shieldPx[i].y); });
ugNodes.forEach((n, i) => { if (swordPx[i]) applyPx(n, swordPx[i].x, swordPx[i].y); });
landNodes.forEach((n, i) => { if (spiritPx[i]) applyPx(n, spiritPx[i].x, spiritPx[i].y); });
const coreLayout = nodes.find(n => n.kind === 'core');
if (coreLayout) applyPx(coreLayout, goalPx.x, goalPx.y);

const layoutW = MAP_W;
const layoutH = MAP_H;

document.getElementById('h-name').textContent = SAVE.displayName || '旅人';
document.getElementById('h-level').textContent = String(SAVE.level || 1);
document.getElementById('h-xp').style.width = (LampSave.xpProgress(SAVE) * 100) + '%';
document.getElementById('h-lamps').textContent = cleared.size + '/' + lessons.length;
document.getElementById('h-bar').style.width = (lessons.length ? cleared.size / lessons.length * 100 : 0) + '%';
document.getElementById('h-titles').textContent = String((SAVE.titles || []).length);

const panel = document.getElementById('panel');
const backBtn = document.getElementById('world-back');
let worldApi = null;

function lessonPlayHref(no) { return 'lesson.html?no=' + no; }
function lessonCmd(l) {
  const root = SAVE.repoRoot ? 'cd "' + SAVE.repoRoot + '"\n' : '';
  return root + 'cd ' + l.path.replace(/\//g, '\\') + '\n.\\Test-Lesson.ps1';
}
function playLink(text, no) {
  const b = el('button', { type: 'button', class: 'play-btn', style: 'display:inline-block;margin:8px 0;padding:10px 16px;background:#1b4a6b;border:1px solid var(--open);border-radius:8px;color:var(--ink);font-weight:600;cursor:pointer' }, text);
  b.onclick = () => openLessonModal(no);
  return b;
}

const sayBox = document.getElementById('say-box');
const saySpeaker = document.getElementById('say-speaker');
const sayText = document.getElementById('say-text');
const sayHint = document.getElementById('say-hint');
const sayActions = document.getElementById('say-actions');
const reducedSay = matchMedia('(prefers-reduced-motion: reduce)').matches;
let sayJob = null;

function splitSayPages(text) {
  const raw = String(text || '').replace(/\s+/g, ' ').trim();
  if (!raw) return [''];
  const parts = [];
  let chunk = '';
  for (let n = 0; n < raw.length; n++) {
    chunk += raw[n];
    if (/[。！？!?]/.test(raw[n])) {
      parts.push(chunk.trim());
      chunk = '';
    }
  }
  if (chunk.trim()) parts.push(chunk.trim());
  const pages = [];
  let buf = '';
  parts.forEach(p => {
    if ((buf + p).length > 42 && buf) {
      pages.push(buf);
      buf = p;
    } else buf += p;
  });
  if (buf) pages.push(buf);
  return pages.length ? pages : [raw];
}

function stopSay() {
  if (sayJob && sayJob.timer) clearInterval(sayJob.timer);
  sayJob = null;
}

function hideSay() {
  stopSay();
  sayBox.classList.remove('show');
  sayActions.classList.remove('show');
  sayActions.innerHTML = '';
  sayHint.style.display = '';
}

function renderSayActions(actions) {
  sayActions.innerHTML = '';
  (actions || []).forEach(a => {
    const b = a.href
      ? el('a', { href: a.href, class: a.primary ? 'primary' : '' }, a.label)
      : el('button', { type: 'button', class: a.primary ? 'primary' : '' }, a.label);
    if (!a.href) b.onclick = () => { hideSay(); if (a.onClick) a.onClick(); };
    else b.onclick = () => hideSay();
    sayActions.appendChild(b);
  });
  sayActions.classList.add('show');
  sayHint.style.display = 'none';
}

function runSay(pages, opts) {
  opts = opts || {};
  stopSay();
  closeLessonModal();
  closeSettings();
  closeDomainSheet();
  const list = Array.isArray(pages) ? pages.filter(Boolean) : splitSayPages(pages);
  saySpeaker.textContent = opts.speaker || '';
  sayBox.classList.add('show');
  sayActions.classList.remove('show');
  sayActions.innerHTML = '';
  sayHint.style.display = '';
  sayHint.textContent = 'クリック／Enter で進む';
  let page = 0;
  let i = 0;
  let full = list[0] || '';
  sayJob = { page, list, opts, done: false, timer: null };

  function paint(partial) {
    sayText.textContent = partial;
    if (!sayJob.done && partial.length < full.length) {
      const cur = el('span', { class: 'say-cursor' }, '▍');
      sayText.appendChild(cur);
    }
  }

  function startPage() {
    full = list[page] || '';
    i = 0;
    sayJob.done = false;
    if (reducedSay || !full) {
      paint(full);
      sayJob.done = true;
      return;
    }
    paint('');
    sayJob.timer = setInterval(() => {
      i += 1;
      paint(full.slice(0, i));
      if (i >= full.length) {
        clearInterval(sayJob.timer);
        sayJob.timer = null;
        sayJob.done = true;
      }
    }, 28);
  }

  function finishAll() {
    stopSay();
    sayJob = { done: true, finished: true };
    paint(list[list.length - 1] || '');
    if (opts.actions && opts.actions.length) renderSayActions(opts.actions);
    else {
      sayHint.textContent = 'クリックで閉じる';
      sayJob.closeOnNext = true;
    }
    if (opts.onDone) opts.onDone();
  }

  function advance() {
    if (!sayBox.classList.contains('show')) return;
    if (sayJob && sayJob.closeOnNext) { hideSay(); return; }
    if (!sayJob || sayJob.finished) return;
    if (!sayJob.done) {
      if (sayJob.timer) clearInterval(sayJob.timer);
      sayJob.timer = null;
      paint(full);
      sayJob.done = true;
      return;
    }
    if (page < list.length - 1) {
      page += 1;
      sayJob.page = page;
      startPage();
      return;
    }
    finishAll();
  }

  sayJob.advance = advance;
  startPage();
}

async function openLessonModal(noOrLesson) {
  const l = typeof noOrLesson === 'object' ? noOrLesson : lessons.find(x => x.no === noOrLesson);
  if (!l) return;
  closeSettings();
  closeDomainSheet();
  hideSay();
  const dom = domains.find(d => d.id === l.domain);
  const play = LampProgress.lessonPlayable(l, dom, cleared, skipped);
  const st = lessonState(l);
  const stLabel = { cleared: 'クリア済み', skipped: '迂回中', next: '次の推奨', todo: '未挑戦' }[st];
  document.getElementById('qm-kicker').textContent = (dom ? dom.title : 'クエスト') + ' · ステージ概要';
  document.getElementById('qm-title').textContent = '講座 ' + pad(l.no) + '　' + l.title;
  const meta = document.getElementById('qm-meta');
  meta.innerHTML = '';
  meta.appendChild(el('span', { class: 'tag ' + (st === 'next' ? 'current' : st === 'cleared' ? 'cleared' : st === 'skipped' ? '' : '') }, stLabel));
  if (dom) meta.appendChild(el('span', { class: 'tag' }, dom.exam || ''));
  if (missed.has(l.no)) meta.appendChild(el('span', { class: 'tag' }, '復習候補'));
  if (!play.ok) meta.appendChild(el('span', { class: 'tag fog' }, '未開放'));
  const desc = document.getElementById('qm-desc');
  desc.textContent = '';
  const quote = document.getElementById('qm-quote');
  quote.hidden = true;
  const go = document.getElementById('qm-go');
  if (!play.ok) {
    go.removeAttribute('href');
    go.textContent = 'まだ挑戦できない';
    go.onclick = (ev) => { ev.preventDefault(); runSay(play.reason, { speaker: '案内', actions: [{ label: 'とじる', onClick: () => {} }] }); };
  } else {
    go.onclick = null;
    go.href = lessonPlayHref(l.no);
    go.textContent = st === 'cleared' ? 'もう一度' : '挑戦する';
  }
  document.getElementById('quest-overlay').classList.add('show');

  const quests = await loadQuests();
  const full = (quests.lessons || []).find(q => q.courseNo === l.no || q.no === l.no);
  let body = '';
  if (!play.ok) body = play.reason;
  else if (full && full.blurb) body = full.blurb;
  else body = 'スライドで学び、問いに答えて灯を点ける。';
  if (st === 'cleared') body += '（復習可）';
  // モーダル内も流して表示
  let i = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) desc.textContent = body;
  else {
    const t = setInterval(() => {
      i += 1;
      desc.textContent = body.slice(0, i);
      if (i >= body.length) clearInterval(t);
    }, 22);
  }
}

function appendSaveTools(panel) {
  panel.appendChild(el('h3', null, '記録'));
  panel.appendChild(el('div', { class: 'stat' }, 'バックアップ／復元／消去'));
  const row = el('div', { class: 'save-row' });
  const ex = el('button', { class: 'panel-btn', type: 'button' }, 'エクスポート');
  ex.onclick = () => LampSave.downloadExport();
  const file = el('input', { type: 'file', accept: 'application/json,.json', style: 'font-size:12px;color:var(--muted)' });
  file.onchange = () => {
    const f = file.files && file.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        LampSave.importFromJson(String(reader.result));
        alert('インポートしました。');
        location.reload();
      } catch (e) {
        alert('インポートできません: ' + e.message);
      }
    };
    reader.readAsText(f, 'UTF-8');
    file.value = '';
  };
  const reset = el('button', { class: 'panel-btn warn', type: 'button' }, '記録を消去');
  reset.onclick = () => {
    if (confirm('ブラウザ内の冒険記録を消します。よろしいですか？')) {
      LampSave.resetLocal();
      location.reload();
    }
  };
  row.appendChild(ex);
  row.appendChild(file);
  row.appendChild(reset);
  panel.appendChild(row);
}

function lessonRow(l, domain) {
  const st = lessonState(l);
  const play = LampProgress.lessonPlayable(l, domain, cleared, skipped);
  const li = el('li', { class: st === 'next' ? 'next' : '' });
  const mark = !play.ok && st !== 'cleared' ? '🔒' : { cleared: '✓', skipped: '↷', next: '▶', todo: '・' }[st];
  li.appendChild(el('span', { class: 'mark ' + st }, mark));
  li.appendChild(el('span', null, pad(l.no) + '　' + l.title));
  const links = el('span');
  const playBtn = el('button', { type: 'button', class: 'copy', style: 'color:var(--open);font-weight:600;border-color:var(--open)' }, play.ok ? '概要' : '未開放');
  playBtn.onclick = (ev) => { ev.preventDefault(); openLessonModal(l); };
  links.appendChild(playBtn);
  links.appendChild(el('a', { href: repoLessonHref(l.path, 'PROBLEMS.md'), target: '_blank', rel: 'noopener' }, 'MD'));
  if (st === 'skipped') {
    const un = el('button', { class: 'copy', type: 'button', title: '迂回をやめる' }, '↩');
    un.onclick = (ev) => {
      ev.preventDefault();
      LampSave.unregisterSkip(LampSave.loadLocal(), l.no);
      location.reload();
    };
    links.appendChild(un);
  }
  li.appendChild(links);
  return li;
}

      actions: [{ label: 'とじる', onClick: () => {} }]
    });

  }
  if (worldApi) worldApi.enterIsland(d, lessonState);

  runSay(line, {

  let tier = 'novice';
  if (level >= 11) tier = 'ascendant';
  else if (level >= 6) tier = 'keeper';
  else if (level >= 3) tier = 'adept';
  let msg = '見た目が「' + tierName[tier] + '」に変わりました。';

const params = new URLSearchParams(location.search);
const arrive = params.get('arrive') === '1';
const fromNo = parseInt(params.get('from'), 10) || 0;
const toNo = parseInt(params.get('to'), 10) || 0;
const doorFx = params.get('door') === '1';
const levelUp = false; // XPレベルアップ演出は使わない
const awardTitles = [];

const LAMP_MAP_MODULE = './lamp-dungeon.js?v=8';
import(LAMP_MAP_MODULE).then(mod => {
  const mount = mod.mountLampWorld || mod.mountLampDungeon || (window.LampDungeon && window.LampDungeon.mountLampWorld);
  if (!mount) { console.error('LampDungeon mount failed'); return; }
  worldApi = mount(document.getElementById('world'), {
    nodes,
    layoutW,
    layoutH,
    level: SAVE.level || 1,
    avatarCourseNo: SAVE.lastCourseNo || 0,
    lessonState,
    growth,
    landOpen,
    reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
    onSelectDomain: (d) => showDomain(d),
    onSelectHub: () => openHubModal(),
    onSelectLesson: (l) => { openLessonModal(l); },
    canTravelRealm: (realm) => LampProgress.realmAccessible(realm, landOpen).ok,
    onTravelBlocked: (realm, reason) => {
      runSay(reason || 'まだ行けない。', { speaker: '謎の老人', actions: [{ label: 'とじる', onClick: () => {} }] });
    },
    onTravelRealm: (realm) => {
      const labels = { sky: '盾の道', land: '大扉の奥', underground: '剣の道' };
      const tip = document.getElementById('world-hint');
      if (tip) tip.textContent = (labels[realm] || realm);
    },
    onModeChange: (mode) => {
      if (mode === 'island') backBtn.classList.add('visible');
      else backBtn.classList.remove('visible');
    }
  });
  const nav = document.getElementById('world-nav');
  if (nav) {
    nav.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-nav]');
      if (!btn || !worldApi) return;
      const act = btn.getAttribute('data-nav');
      if (act === 'overview') worldApi.showOverview();
      else if (act === 'hub') {
        if (worldApi.returnToHub) worldApi.returnToHub(0);
        openHubModal();
      } else travelToRealmSafe(act);
    });
  }

  if (arrive && worldApi) {
    refreshGrowthFromSave();
    const fromDom = domains.find(d => d.lessons && d.lessons.some(l => l.no === fromNo));
    const toDom = toNo ? domains.find(d => d.lessons && d.lessons.some(l => l.no === toNo)) : null;
    const playDom = toDom || fromDom;
    const goNext = () => {
      if (toNo) {
        const L = lessons.find(l => l.no === toNo);
        if (toDom) {
          worldApi.enterIsland(toDom, lessonState);
          if (L) setTimeout(() => openLessonModal(L), 200);
          else showDomain(toDom);
        }
      } else if (fromDom) {
        showDomain(fromDom);
      }
      history.replaceState({}, '', 'map.html');
    };
    if (playDom) {
      worldApi.placeAvatarForProgress(fromNo || toNo);
      worldApi.enterIsland(playDom, lessonState);
      if (doorFx && worldApi.playClearDoorThen) {
        worldApi.playClearDoorThen(goNext);
      } else {
        goNext();
      }
    } else {
      history.replaceState({}, '', 'map.html');
    }
  }

  // 初回だけ短い案内
  if (!SAVE.lastCourseNo && !arrive) {
    setTimeout(() => {
      if (!sayBox.classList.contains('show')) {
        runSay(['ここは三つの扉の間。', '老人に話しかけてみよう。'], {
          speaker: '案内',
          actions: [{ label: 'わかった', onClick: () => {} }]
        });
      }
    }, 500);
  }
}).catch(err => {
  console.error(err);
  const msg = (err && err.message) ? String(err.message) : 'unknown';
  document.getElementById('world').appendChild(el('div', { class: 'warn', style: 'margin:16px' },
    'マップを読めませんでした。再読み込みしてください。（' + msg + '）'));
});
